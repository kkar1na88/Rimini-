<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>点击地图查看大图与地址 - 示例</title>

<!-- 1. 引入 Leaflet 的 CSS 和 JS(免费开源地图库,不需要 API Key) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Microsoft YaHei", sans-serif; }
  #map { width: 100%; height: 100vh; }

  /* 简单的圆点标记,取代之前的圆形缩略图 */
  .thumb-marker {
    width: 28px; height: 28px; border-radius: 50%;
    background: #fff4dc; border: 2px solid #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  /* 弹出的大图 + 地址,改成简单的白色卡片,不用深色遮罩 */
  #lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(255,255,255,.9); z-index: 9999;
    align-items: center; justify-content: center; flex-direction: column;
  }
  #lightbox img {
    max-width: 80vw; max-height: 70vh;
  }
  #lightbox .address {
    color: #333; margin-top: 12px; font-size: 15px; text-align: center;
    max-width: 80vw;
  }
  #lightbox .close {
    position: absolute; top: 20px; right: 30px;
    color: #333; font-size: 24px; cursor: pointer; background: none; border: none;
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="lightbox">
  <button class="close" onclick="closeLightbox()">&times;</button>
  <img id="lightbox-img" src="" alt="">
  <div id="lightbox-address" class="address"></div>
</div>

<script>
// 2. 你的数据:每个点包含 坐标、缩略图、大图、地址
// 这就是你以后要替换成自己内容的部分
const spots = [
  {
    lat: 44.0624, lng: 12.5700,
    thumb: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=200",
    full:  "https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=1200",
    address: "Arco di Augusto, Via Augusto Cesare Bertola, 47921 Rimini RN, Italy",
    icon: "🍝"
  },
  {
    lat: 44.0637, lng: 12.5692,
    thumb: "https://images.unsplash.com/photo-1591878185093-8b6b0b3f0b0e?w=200",
    full:  "https://images.unsplash.com/photo-1591878185093-8b6b0b3f0b0e?w=1200",
    address: "Ponte di Tiberio, Piazzale Giulio Cesare, 47921 Rimini RN, Italy",
    icon: "📖"
  },
  {
    lat: 44.0599, lng: 12.5644,
    thumb: "https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=200",
    full:  "https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=1200",
    address: "Tempio Malatestiano, Via IV Novembre, 35, 47921 Rimini RN, Italy",
    icon: "🏰"
  },
  {
    lat: 44.0634, lng: 12.5623,
    thumb: "https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=200",
    full:  "https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=1200",
    address: "Tempio Malatestiano, Via IV Novembre, 35, 47921 Rimini RN, Italy",
    icon: "🌉"
  },
  {
    lat: 44.0572, lng: 12.5711,
    thumb: "https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=200",
    full:  "https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=1200",
    address: "Tempio Malatestiano, Via IV Novembre, 35, 47921 Rimini RN, Italy",
    icon: "🚪"
  },
  {
    lat: 44.0572, lng: 12.5711,
    thumb: "https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=200",
    full:  "https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=1200",
    address: "Tempio Malatestiano, Via IV Novembre, 35, 47921 Rimini RN, Italy",
    icon: "🚪"
  }
];

// 3. 初始化地图,设置初始视角(里米尼城区中心,15 是街道级缩放)
const map = L.map('map').setView([44.0605, 12.5690], 15);

// 3.1 (可选)限制用户拖动/缩小地图时不能离开里米尼区域太远
// 格式是 [[南边界纬度, 西边界经度], [北边界纬度, 东边界经度]]
const riminiBounds = [[44.02, 12.52], [44.10, 12.62]];
map.setMaxBounds(riminiBounds);
map.setMinZoom(13);

// 4. 加载 MapTiler streets-v2 底图,风格接近 Google Maps
// 【重要】把下面 YOUR_MAPTILER_API_KEY 换成你自己在 maptiler.com 拿到的 Key
L.tileLayer('https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=uQIiuszChRaxXJd7ouPD', {
  attribution: '&copy; <a href="https://www.maptiler.com/">MapTiler</a> &copy; OpenStreetMap 贡献者',
  maxZoom: 19
}).addTo(map);

// 5. 遍历数据,给每个点创建一个"缩略图标记"并绑定点击事件
spots.forEach(spot => {
  const icon = L.divIcon({
    className: '',
    html: `<div class="thumb-marker" style="background:${spot.color || '#fff4dc'}">${spot.icon || ''}</div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 14]
  });

  const marker = L.marker([spot.lat, spot.lng], { icon }).addTo(map);

  // 点击标记时,打开大图 + 显示地址
  marker.on('click', () => openLightbox(spot.full, spot.address));
});

// 6. 弹窗的显示/关闭逻辑
function openLightbox(imgUrl, address) {
  document.getElementById('lightbox-img').src = imgUrl;
  document.getElementById('lightbox-address').textContent = address;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}
</script>

</body>
</html>
