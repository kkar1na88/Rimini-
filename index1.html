<!-- 1. 引入 Leaflet 的 CSS 和 JS(免费开源地图库,不需要 API Key) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Microsoft YaHei", sans-serif; }
  #map { width: 100%; height: 100vh; }

  /* 简单的圆点标记,取代之前的圆形缩略图 */
  .thumb-marker {
    width: 38px; height: 38px; border-radius: 50%;
    background: #fff4dc; border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transition: transform 0.2s ease;
  }

  /* 弹出的大图 + 地址,改成简单的白色卡片,不用深色遮罩 */
  #lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(255,255,255,.9); z-index: 9999;
    align-items: center; justify-content: center; flex-direction: column;
  }
  #lightbox img {
    max-width: 80vw; max-height: 70vh;
  }
  #lightbox .address {
    color: #333; margin-top: 12px; font-size: 15px; text-align: center;
    max-width: 80vw;
  }
  #lightbox .address.loading {
    color: #999; font-style: italic;
  }
  #lightbox .desc {
    color: #555; margin-top: 8px; font-size: 14px; text-align: center;
    max-width: 80vw; line-height: 1.6;
  }
  #lightbox .close {
    position: absolute; top: 20px; right: 30px;
    color: #333; font-size: 24px; cursor: pointer; background: none; border: none;
  }

  /* 左上角分类 tabs */
  #tabs {
    position: fixed; top: 16px; left: 16px; z-index: 1000;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .tab {
    background: #fff; border: none; border-radius: 20px;
    padding: 7px 16px; font-size: 14px; color: #555;
    cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }
  .tab.active {
    background: #333; color: #fff;
  }
</style>

<div id="map"></div>

<div id="tabs">
  <button class="tab active" data-cat="全部">全部</button>
  <button class="tab" data-cat="落地后办理❗️">落地后办理❗️</button>

<div id="lightbox">

// 3. 初始化地图,设置初始视角(里米尼城区中心,15 是街道级缩放)
const map = L.map('map').setView([44.0605, 12.5690], 14);

// 3.1 (可选)限制用户拖动/缩小地图时不能离开里米尼区域太远
// 格式是 [[南边界纬度, 西边界经度], [北边界纬度, 东边界经度]]
const riminiBounds = [[44.02, 12.52], [44.10, 12.62]];
map.setMaxBounds(riminiBounds);
map.setMinZoom(13);

// 4. 加载 MapTiler streets-v2 底图,风格接近 Google Maps
// 【重要】把下面 YOUR_MAPTILER_API_KEY 换成你自己在 maptiler.com 拿到的 Key
L.tileLayer('https://api.maptiler.com/maps/basic-v2/{z}/{x}/{y}.png?key=uQIiuszChRaxXJd7ouPD', {
  attribution: '&copy; <a href="https://www.maptiler.com/">MapTiler</a> &copy; OpenStreetMap 贡献者',
  maxZoom: 17
}).addTo(map);

// 5. 遍历数据,给每个点创建一个"缩略图标记"并绑定点击事件
// markerRefs 用来记住每个 marker 对应的分类,方便后面按 tab 筛选显示/隐藏
const markerRefs = [];

spots.forEach(spot => {
  const icon = L.divIcon({
    className: '',
    html: `<div class="thumb-marker" style="background:${spot.color || '#fff4dc'}">${spot.icon || ''}</div>`,
    iconSize: [44, 44],
    iconAnchor: [22, 22]
  });

  const marker = L.marker([spot.lat, spot.lng], { icon }).addTo(map);

  // 点击标记时,打开大图 + 显示手写的地址和描述
  marker.on('click', () => openLightbox(spot.full, spot.address, spot.desc));

  markerRefs.push({ marker, category: spot.category || '其他' });
});

// 5.1 按分类筛选:符合条件的标记加回地图,不符合的从地图移除
function filterByCategory(cat) {
  markerRefs.forEach(({ marker, category }) => {
    const shouldShow = (cat === '全部' || category === cat);
    const isOnMap = map.hasLayer(marker);
    if (shouldShow && !isOnMap) marker.addTo(map);
    if (!shouldShow && isOnMap) map.removeLayer(marker);
  });
}

// 5.2 给每个 tab 按钮绑定点击事件
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterByCategory(btn.dataset.cat);
  });
});

// 6. 弹窗的显示/关闭逻辑
function openLightbox(imgUrl, address, desc) {
  document.getElementById('lightbox-img').src = imgUrl;
  document.getElementById('lightbox-address').textContent = address;
  document.getElementById('lightbox-desc').textContent = desc || '';
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}
